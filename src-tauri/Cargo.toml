[package]
name = "rlcommander"
version = "1.0.0"
description = "RLCommander - Total Commander Clone with SFTP Support"
authors = ["RLCommander Team"]
edition = "2021"

[lib]
name = "rlcommander_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
ssh2 = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
